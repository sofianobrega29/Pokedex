<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon Card</title>
    <link rel="stylesheet" href="css/card.css">
   
</head>
<body>

    <div class="fundo">

        <h1>NOME DO DIGIMON #Nº1</h1>
        <div class="imagem-digimon">
            <img src="digimon.png" alt="Digimon">
        </div>

        <div class="informacoes">

            <div class="campo">
                <h2>Tipo</h2>
                <p>Dragão</p>
            </div>

            <div class="campo">
                <h2>Nível</h2>
                <p>Campeão</p>
            </div>

            <div class="campo">
                <h2>Atributo</h2>
                <p>Vacina</p>
            </div>

        </div>

        <div class="descricao">
            <h2>Descrição</h2>
            <p>
                Escreva aqui as informações sobre o Digimon,
                suas características e sua história.
            </p>
        </div>

        <div class="habilidade">
            <h2>Habilidade</h2>
            <p>Nome da habilidade do Digimon</p>
        </div>

    </div>

</body>
</html>
