<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXMON</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="digimon">
        <div class="logo">Dexmon</div>
        <h1 class="projeto">Digi Analyzer</h1>
        <div class="cabeca">
            <!--Busca rápida por nome ou ID-->
            <div class="box">
                <input type="text" id="search-input" placeholder="Buscar por Nome ou ID">
                <button id="bnt-search" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <!--Botão me Surpreenda-->
            <button id="bnt-random" title="Me Surpreenda!"><i class="fa-solid fa-dice"></i></button>
        </div>
    </header>

 <nav class="barra">

    <button id="btn-menu">☰</button>

    <div class="perfil">
        <div class="perfil-box">
            <img src="imagens/1000323966.jpg" alt="Perfil">
            <span>Ana Élida</span>
        </div>
    </div>

    <div class="menu">
        <div class="menu-item">
            <img src="imagens/casa.png" alt="Início">
            <span>Início</span>
        </div>
    </div>

     <div class="menu">
        <div class="menu-item">
            <img src="imagens/favorito.png" alt="Início">
            <span>Favoritos</span>
        </div>
    </div>

     <div class="menu">
        <button class="menu-item" id="btn-noturno">
            <img src="imagens/lua.png" alt="Noturno">
            <span>Noturno</span>
        </button>
    </div>

     <div class="menu">
        <button class="menu-item" id="btn-configuracoes">
            <img src="imagens/configuracao.png" alt="Configurações">
            <span>Configurações</span>
        </button>
    </div>
</nav>

<main class="conteudo">

        <div class="caixa">
            <a href="card.html?id=1">
                <img src="imagens/Agumon.png" alt="Agumon">
                <h3>Agumon</h3>
            </a>
        </div>
</main>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">



<!-- Painel de Configurações -->
<div id="painel-configuracoes" class="painel-configuracoes">
    <div class="conteudo-configuracoes">
        <button id="fechar-configuracoes" class="fechar-configuracoes">X</button>

        <h2>Sobre o Dexmon</h2>

        <p>
            Conheça o projeto Dexmon, seus objetivos e informações.
        </p>
    </div>
</div>
    <script src="javascript/script.js"></script>
    <script src="javascript/dados.js"></script>
</body>
</html>
