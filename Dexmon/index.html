<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXMON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="digimon">
        <div class="logo">Dexmon</div>
        <h1 class="projeto">Digi Analyzer</h1>
        <div class="cabeça">
            <!--Busca rápida por nome ou ID-->
            <div class="box">
                <input type="text" id="search-input" placeholder="Buscar por Nome ou ID">
                <button id="bnt-search" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <!--Botão me Surpreenda-->
            <button id="bnt-random" title="Me Surpreenda!"><i class="fa-solid" fa-bell></i></button>
        </div>
    </header>
